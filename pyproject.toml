[project]
name = "ccdr-tests"
version = "0.1.0"
description = "Public-data test battery for CCDR v7.5 engineering predictions"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.32",
    "platformdirs>=4",
    "tenacity>=8.3",
    # quantum-code simulation (QC1-QC4)
    "stim>=1.13",
    "pymatching>=2.2",
    # gravitational-wave data (AE2)
    "gwpy>=3.0",
    "gwosc>=0.7",
    # plotting / reporting
    "matplotlib>=3.9",
    "jinja2>=3.1",
    # statistical tests
    "statsmodels>=0.14",
    "pingouin>=0.5",
    # arXiv API for transmon survey (QC5)
    "arxiv>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
ccdr-tests = "ccdr_tests.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
